name: Build Add-on

on:
  push:
    branches: [ "main", "feature/phase-2-3d-generation" ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Package Version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            BASE_VERSION=$(grep -oP '(?<=^version = ")[^"]*' packaging_studio/blender_manifest.toml)
            SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
            VERSION="${BASE_VERSION}-${SAFE_BRANCH}.${GITHUB_RUN_NUMBER}"
          fi
          echo "Setting version to: $VERSION"
          sed -i 's/^version = .*/version = "'"$VERSION"'"/' packaging_studio/blender_manifest.toml

      - name: Cache Blender
        uses: actions/cache@v4
        id: cache-blender
        with:
          path: ./blender-4.2.0-linux-x64
          key: blender-4.2.0-linux-x64
          
      - name: Download Blender 4.2
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf blender.tar.xz
          
      - name: Add Blender to PATH
        run: echo "${PWD}/blender-4.2.0-linux-x64" >> $GITHUB_PATH

      - name: Build Extension
        run: |
          blender -b -P packaging_studio/build.py
          
      - name: List files (Debug)
        run: ls -la
          
      - name: Validate Built Extensions
        run: |
          for package in *.zip; do
            blender -b --command extension validate "$package"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-studio-build
          path: "**/*.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
